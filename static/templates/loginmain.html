{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login / Signup</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Link external CSS -->
    <link rel="stylesheet" href="{% static 'css/loginmain.css.css' %}">
</head>

<!-- Body starts in SIGNUP mode -->
<body class="login">

    <!-- Background color shapes -->
    <div class="bg">
        <div class="shape-blue"></div>
        <div class="shape-yellow"></div>
    </div>

    <div class="container">

        <!-- ================= SIGNUP PAGE ================= -->
        <div class="page" id="signupPage">
            <div class="side">
                <h1>Join FinanceTracker</h1>
                <h3>Start tracking your finances today</h3>
                <p>Do you already have an account?</p>
                <a class="link-btn" id="toLogin">Log In</a>
            </div>

            <div class="form">
                <h2 class="title">Sign-Up Page</h2>

                <label>Email Address:</label>
                <input type="email">

                <label>Password:</label>
                <input type="password">

                <label>Confirm Password:</label>
                <input type="password">

                <button class="btn">Sign Up</button>
            </div>
        </div>

        <!-- ================= LOGIN PAGE ================= -->
        <div class="page active" id="loginPage">
            <div class="side">
                <h1>Welcome Back</h1>
                <h3>Login to continue</h3>
                <p>Don’t have an account?</p>
                <a class="link-btn" id="toSignup">Sign Up</a>
            </div>

            <div class="form">
                <h2 class="title">Login Page</h2>

                <label>Email Address:</label>
                <input type="email">

                <label>Password:</label>
                <input type="password">

                <button class="btn">Log In</button>
            </div>
        </div>

    </div>

    <!-- Link external JS -->
    <script src="loginmain.js"></script>
</body>
</html>
