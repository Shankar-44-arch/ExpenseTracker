{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reports</title>

    <link rel="stylesheet" href="{% static 'css/report1.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<body>

<div class="layout">

     <!-- ========== SIDEBAR ========== -->
    <div class="sidebar">
        <h2 class="logo">FinTracker</h2>

        <nav class="menu">
            <a href="{%  url 'dashboard' %}">Dashboard</a>
            <a href="{%  url 'transaction' %}">Transactions</a>
            <a href="{%  url 'category' %}">Categories</a>
            <a href="{%  url 'report' %}" class="active">Reports</a>
            <a href="{% url 'calculator' %}">Calculator</a>
            <a href="{% url 'alert' %}">Alerts</a>
            <a href="{% url 'stock' %}">Stocks</a>
            <a href="{%  url 'setting' %}">Settings</a>
            <a href="{% url 'logout' %}" class="logout-link">Logout</a>
        </nav>

        <div class="profile">
            <p><strong>{{ request.user.username }}</strong></p>
            <small>{{ request.user.email }}</small>
        </div>
    </div>

    <main class="content">

        <!-- Page Intro -->
        <div class="page-intro">
            <h2>Report</h2>
            <p>Report of your finances</p>
        </div>

        <!-- Charts -->
        <div class="chart-section">

            <div class="chart-box">
                <h3>Monthly Trend</h3>
                <canvas id="monthlyChart"></canvas>
            </div>

            <div class="chart-box">
                <h3>Expenses by Category</h3>
                <canvas id="expenseChart"></canvas>
            </div>

            <div class="chart-box">
                <h3>Income vs Expense</h3>
                <canvas id="incomeExpenseChart"></canvas>
            </div>

        </div>

        <!-- Export -->
        <div class="export-section">
            <h3>Export Reports</h3>
            <div class="export-buttons">
                <a href="{% url 'export_excel' %}"><button>Excel</button></a>
                <a href="{% url 'export_csv' %}"><button>CSV</button></a>
                <a href="{% url 'export_pdf' %}"><button>PDF</button></a>
                <button id="exportImageBtn" data-url="{% url 'export_image' %}">Image</button>
            </div>
        </div>

<!-- Hidden canvas for image export -->
<canvas id="exportCanvas" class="hidden" width="800" height="500"></canvas>

<div id="reportDataHolder"
     data-month-labels='{{ month_labels|safe }}'
     data-month-expense='{{ month_expense_data|safe }}'
     data-month-income='{{ month_income_data|safe }}'
     data-cat-labels='{{ cat_labels|safe }}'
     data-cat-data='{{ cat_data|safe }}'
     class="hidden"></div>

<script src="{% static 'js/report.js' %}"></script>
<script src="{% static 'js/theme.js' %}"></script>

    </main>
</div>

</body>
</html>
