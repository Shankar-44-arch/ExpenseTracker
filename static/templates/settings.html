{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Settings</title>
    <link rel="stylesheet" href="{% static 'css/settings.css' %}">
</head>
<body>

<div class="layout">

    <!-- ========== SIDEBAR ========== -->
    <div class="sidebar">
        <h2 class="logo">FinTracker</h2>

        <nav class="menu">
            <a href="{%  url 'dashboard' %}">Dashboard</a>
            <a href="{%  url 'transaction' %}">Transactions</a>
            <a href="{%  url 'category' %}">Categories</a>
            <a href="{%  url 'report' %}">Reports</a>
            <a href="{%  url 'setting' %}" class="active">Settings</a>
        </nav>

        <div class="profile">
            <p><strong>John Doe</strong></p>
            <small>View profile</small>
        </div>
    </div>

    <main class="content">

        <!-- Page Intro -->
        <div class="page-intro">
            <h2>Settings</h2>
            <p>Let's made some changes</p>
        </div>

        <div class="settings-card">
            <h3>Profile</h3>
            <p>Name: John Doe</p>
            <p>Email: john@example.com</p>
            <button>Edit Profile</button>
        </div>

        <div class="settings-card">
            <h3>Account</h3>
            <button class="logout">Logout</button>
        </div>

    </main>
</div>

</body>
</html>
